name: 采集岗位数据

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 抓取岗位
        run: python3 collect_jobs.py
      - name: 提交数据
        run: |
          git config user.name "job-collector"
          git config user.email "124942026@qq.com"
          git add jobs.json
          if git diff --staged --quiet; then
            echo "本轮无变化"
          else
            git commit -m "chore: 采集岗位 $(date -u '+%H:%M') UTC"
            git push
          fi
